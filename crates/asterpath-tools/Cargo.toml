[package]
name = "asterpath-tools"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
asterpath-protocol = { path = "../asterpath-protocol" }
futures-core = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt", "time"] }
