[package]
name = "asterpath-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "asterpath"
path = "src/main.rs"

[features]
default = ["anthropic", "openai", "sqlite"]
anthropic = ["asterpath/anthropic"]
openai = ["asterpath/openai"]
sqlite = ["asterpath/sqlite"]

[dependencies]
asterpath = { path = "../asterpath", default-features = false }
asterpath-core = { path = "../asterpath-core" }
asterpath-protocol = { path = "../asterpath-protocol" }
asterpath-skills = { path = "../asterpath-skills" }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
asterpath-storage-sqlite = { path = "../asterpath-storage-sqlite" }
asterpath-testing = { path = "../asterpath-testing" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
