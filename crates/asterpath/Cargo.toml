[package]
name = "asterpath"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["anthropic", "sqlite"]
anthropic = ["dep:asterpath-provider-anthropic"]
sqlite = ["dep:asterpath-storage-sqlite"]

[dependencies]
asterpath-agent = { path = "../asterpath-agent" }
asterpath-core = { path = "../asterpath-core" }
asterpath-protocol = { path = "../asterpath-protocol" }
asterpath-provider-anthropic = { path = "../asterpath-provider-anthropic", optional = true }
asterpath-storage-sqlite = { path = "../asterpath-storage-sqlite", optional = true }
futures-core = "0.3"
futures-util = "0.3"
thiserror = "2"

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
