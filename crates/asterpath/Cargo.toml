[package]
name = "asterpath"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["anthropic", "openai", "sqlite"]
anthropic = ["dep:asterpath-provider-anthropic"]
openai = ["dep:asterpath-provider-openai"]
sqlite = ["dep:asterpath-storage-sqlite"]

[dependencies]
asterpath-protocol = { path = "../asterpath-protocol" }
asterpath-provider-anthropic = { path = "../asterpath-provider-anthropic", optional = true }
asterpath-provider-openai = { path = "../asterpath-provider-openai", optional = true }
asterpath-storage-sqlite = { path = "../asterpath-storage-sqlite", optional = true }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
