[package]
name = "asterpath-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
asterpath-protocol = { path = "../asterpath-protocol" }
futures-core = "0.3"
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
