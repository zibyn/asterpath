[package]
name = "asterpath-http"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
asterpath-protocol = { path = "../asterpath-protocol" }
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false }
serde_json = "1"

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
