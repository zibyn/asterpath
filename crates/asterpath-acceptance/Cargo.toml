[package]
name = "asterpath-acceptance"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "testdrive"
path = "src/bin/testdrive.rs"

[dependencies]
asterpath = { path = "../asterpath" }
asterpath-plugin-host = { path = "../asterpath-plugin-host" }
asterpath-protocol = { path = "../asterpath-protocol" }
asterpath-sandbox = { path = "../asterpath-sandbox" }
asterpath-sandbox-linux = { path = "../asterpath-sandbox-linux" }
asterpath-skills = { path = "../asterpath-skills" }
asterpath-storage-sqlite = { path = "../asterpath-storage-sqlite" }
asterpath-testing = { path = "../asterpath-testing" }
asterpath-tools = { path = "../asterpath-tools" }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
assert_cmd = "2"
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
