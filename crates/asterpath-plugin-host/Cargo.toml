[package]
name = "asterpath-plugin-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
asterpath-http = { path = "../asterpath-http" }
asterpath-protocol = { path = "../asterpath-protocol" }
asterpath-sandbox = { path = "../asterpath-sandbox" }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
asterpath-tools = { path = "../asterpath-tools" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
