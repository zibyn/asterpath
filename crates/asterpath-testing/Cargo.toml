[package]
name = "asterpath-testing"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
asterpath-core = { path = "../asterpath-core" }
asterpath-protocol = { path = "../asterpath-protocol" }
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
