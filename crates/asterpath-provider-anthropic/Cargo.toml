[package]
name = "asterpath-provider-anthropic"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
asterpath-core = { path = "../asterpath-core" }
asterpath-http = { path = "../asterpath-http" }
asterpath-protocol = { path = "../asterpath-protocol" }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"

[dev-dependencies]
asterpath-testing = { path = "../asterpath-testing" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
