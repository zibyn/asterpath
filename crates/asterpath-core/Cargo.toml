[package]
name = "asterpath-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
