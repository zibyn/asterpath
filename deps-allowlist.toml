# Dependency allowlist for the Asterpath workspace.
#
# Machine-readable source of truth; docs/design/packaging.md §2 is the normative
# human-readable copy. `cargo xtask check-deps` enforces (ADR-0026):
#   - every workspace member is listed here with its role;
#   - every normal dependency on another workspace member is in that member's
#     `allow` list ("*" = any workspace member, apps only);
#   - role rules: `protocol` depends on no member and declares no features;
#     an `adapter` depends only on protocol and other adapters; the `engine`
#     depends only on protocol and the adapters it re-exports or feature-gates.
#
# Only normal dependencies are checked. Dev-dependencies are intentionally exempt
# (crates may dev-depend on `asterpath-testing` for contract suites).

[[package]]
name = "asterpath-protocol"
role = "protocol"
allow = []

# Shared HTTP / SSE plumbing for the adapters (ADR-0026 re-audit candidate 5
# revision). An adapter peer, not part of the stable surface.
[[package]]
name = "asterpath-http"
role = "adapter"
allow = ["asterpath-protocol"]

# Linux bwrap backend for protocol's `SandboxProvider` (ADR-0027).
[[package]]
name = "asterpath-sandbox-linux"
role = "adapter"
allow = ["asterpath-protocol"]

[[package]]
name = "asterpath-storage-sqlite"
role = "adapter"
allow = ["asterpath-protocol"]

# Postgres store for several nodes sharing one database (#162).
[[package]]
name = "asterpath-storage-postgres"
role = "adapter"
allow = ["asterpath-protocol"]

[[package]]
name = "asterpath-provider-anthropic"
role = "adapter"
allow = ["asterpath-protocol", "asterpath-http"]

[[package]]
name = "asterpath-provider-openai"
role = "adapter"
allow = ["asterpath-protocol", "asterpath-http"]

# MCP tool source (ADR-0027).
[[package]]
name = "asterpath-mcp"
role = "adapter"
allow = ["asterpath-protocol", "asterpath-http"]

[[package]]
name = "asterpath-skills"
role = "adapter"
allow = ["asterpath-protocol"]

# Root-bound file and shell tools (#83).
[[package]]
name = "asterpath-tools"
role = "adapter"
allow = ["asterpath-protocol"]

# Test support: in-memory backend, scripted provider, fake sandbox, contract suites.
[[package]]
name = "asterpath-testing"
role = "adapter"
allow = ["asterpath-protocol"]

[[package]]
name = "asterpath"
role = "engine"
allow = [
    "asterpath-protocol",
    "asterpath-provider-anthropic",
    "asterpath-provider-openai",
    "asterpath-storage-sqlite",
    "asterpath-storage-postgres",
]

# Local application (ADR-0049): the CLI binary and, behind the `tauri`
# feature, the desktop window (ADR-0035).
[[package]]
name = "asterpath-app"
role = "app"
allow = ["*"]

[[package]]
name = "asterpath-acceptance"
role = "app"
allow = ["*"]

[[package]]
name = "asterpath-mcp-fixture"
role = "tool"
allow = []

[[package]]
name = "xtask"
role = "tool"
allow = []
